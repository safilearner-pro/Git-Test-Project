<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A polished hello world landing page." />
  <title>Hello, World! ✨</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f8fbff;
      --muted: #b8c4df;
      --accent: #8b5cf6;
      --accent-2: #22d3ee;
      --glass: rgba(14, 20, 48, 0.58);
      --line: rgba(255, 255, 255, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #080b1b;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 42vw;
      height: 42vw;
      border-radius: 50%;
      filter: blur(12px);
      opacity: 0.55;
      z-index: -1;
      animation: drift 12s ease-in-out infinite alternate;
    }

    body::before {
      top: -15vw;
      left: -10vw;
      background: radial-gradient(circle, #7c3aed 0%, transparent 68%);
    }

    body::after {
      right: -10vw;
      bottom: -18vw;
      background: radial-gradient(circle, #0891b2 0%, transparent 68%);
      animation-delay: -4s;
    }

    main {
      width: min(92vw, 760px);
      padding: 1px;
      border: 1px solid var(--line);
      border-radius: 32px;
      background: linear-gradient(135deg, rgba(255,255,255,.3), rgba(255,255,255,.04));
      box-shadow: 0 30px 100px rgba(0,0,0,.4);
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: clamp(2.5rem, 8vw, 6rem) clamp(1.5rem, 8vw, 6rem);
      text-align: center;
      border-radius: 31px;
      background: var(--glass);
      backdrop-filter: blur(24px);
    }

    nav { display: flex; justify-content: center; gap: .5rem; margin-bottom: 2.5rem; }
    nav a { color: var(--muted); text-decoration: none; padding: .5rem .8rem; border-radius: 999px; }
    nav a:hover, nav a[aria-current="page"] { color: white; background: rgba(255,255,255,.12); }

    .sparkle {
      display: inline-grid;
      width: 58px;
      height: 58px;
      place-items: center;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(139,92,246,.85), rgba(34,211,238,.7));
      box-shadow: 0 12px 30px rgba(34,211,238,.2);
      font-size: 1.8rem;
      animation: float 4s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.2rem, 10vw, 6.8rem);
      line-height: .95;
      letter-spacing: -.07em;
      background: linear-gradient(100deg, #fff 15%, #c4b5fd 48%, #67e8f9 90%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      max-width: 480px;
      margin: 1.5rem auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      line-height: 1.7;
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      margin-top: 2.2rem;
      padding: .9rem 1.25rem;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 999px;
      color: white;
      text-decoration: none;
      background: rgba(255,255,255,.1);
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
    }

    .button:hover { transform: translateY(-3px); background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.45); }

    @keyframes drift { to { transform: translate(5vw, 4vh) scale(1.12); } }
    @keyframes float { 50% { transform: translateY(-8px) rotate(4deg); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="greeting">
      <nav aria-label="Main navigation">
        <a href="index.html" aria-current="page">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="sparkle" aria-hidden="true">✦</div>
      <h1 id="greeting">Hello, world!</h1>
      <p>A tiny beginning with a little extra sparkle. Welcome to your new corner of the web.</p>
      <a class="button" href="#greeting">Let’s begin <span aria-hidden="true">→</span></a>
    </section>
  </main>
</body>
</html>
